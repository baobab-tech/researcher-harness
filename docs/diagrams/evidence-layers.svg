<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 362" role="img" aria-labelledby="el-title el-desc">
  <title id="el-title">Evidence layers</title>
  <desc id="el-desc">Four layers, each written from the one to its left. Layer 0, Raw: .cache/NNN.txt, the full text as fetched by scripts/fetch.sh, gitignored. Layer 1, Source: sources/NNN-*.md, one file per source with its numbers, boundary, funding, and limits. Layer 2, Claim: claims.md, entries C001 onward with statement, scope, period, attribution, kind, quote, status, and human check. Layer 3, Output: outputs/*.md, prose citing claim IDs such as [C001]. The human sanity check marks claims in layer 2 confirmed, wrong, or unsure. scripts/check.sh validates the links from outputs to claims and from claims to source files.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .b { font-weight: 600; }
    .t14 { font-size: 14px; }
    .t15 { font-size: 15px; }
    .hb { fill: #fff4e5; stroke: #d97706; stroke-width: 1.5; }
    .ab { fill: #eef4ff; stroke: #1f6feb; stroke-width: 1.5; }
    .fb { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .ht { fill: #92400e; }
    .at { fill: #0550ae; }
    .t1 { fill: #1f2328; }
    .t2 { fill: #424a53; }
    .mu { fill: #6e7781; }
    .ln { fill: none; stroke: #848d97; stroke-width: 1.5; }
    .rule { fill: none; stroke: #d0d7de; stroke-width: 1; }
    .aln { fill: none; stroke: #1f6feb; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .adot { fill: #1f6feb; }
    .ah { fill: #848d97; }
    .hah { fill: #d97706; }
    .hln { fill: none; stroke: #d97706; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .hb { fill: #2b1d0c; stroke: #d18616; }
      .ab { fill: #0c2240; stroke: #4493f8; }
      .fb { fill: #161b22; stroke: #6e7681; }
      .ht { fill: #f2b35c; }
      .at { fill: #79b8ff; }
      .t1 { fill: #e6edf3; }
      .t2 { fill: #b1bac4; }
      .mu { fill: #848d97; }
      .ln { stroke: #7d8590; }
      .rule { stroke: #30363d; }
      .aln { stroke: #4493f8; }
      .adot { fill: #4493f8; }
      .ah { fill: #7d8590; }
      .hah { fill: #d18616; }
      .hln { stroke: #d18616; }
    }
  </style>
  <defs>
    <marker id="el-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="ah" d="M0,1 L10,5 L0,9 Z"/>
    </marker>
    <marker id="el-arrow-h" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="hah" d="M0,1 L10,5 L0,9 Z"/>
    </marker>
  </defs>

  <!-- fetch.sh feeds layer 0 -->
  <rect class="ab" x="16" y="16" width="164" height="46" rx="8"/>
  <text class="at b mono" x="98" y="35" text-anchor="middle">scripts/fetch.sh</text>
  <text class="t2" x="98" y="53" text-anchor="middle">URL or PDF to text</text>
  <path class="ln" d="M98,62 V100" marker-end="url(#el-arrow)"/>

  <!-- human sanity check touches layer 2 -->
  <rect class="hb" x="410" y="16" width="232" height="46" rx="8"/>
  <text class="ht b t14" x="526" y="35" text-anchor="middle">Human sanity check</text>
  <text class="t2" x="526" y="53" text-anchor="middle">confirmed · wrong · unsure</text>
  <path class="hln" d="M526,62 V100" marker-end="url(#el-arrow-h)"/>

  <!-- Layer 0: Raw -->
  <rect class="fb" x="16" y="100" width="164" height="160" rx="10"/>
  <circle class="fb" cx="41" cy="126" r="11"/>
  <text class="t1 b" x="41" y="130.5" text-anchor="middle">0</text>
  <text class="t1 b t15" x="60" y="131">Raw</text>
  <text class="t1 mono" x="30" y="156">.cache/NNN.txt</text>
  <path class="rule" d="M30,170 H166"/>
  <text class="t2" x="30" y="190">full text</text>
  <text class="t2" x="30" y="209">gitignored</text>

  <!-- Layer 1: Source -->
  <rect class="fb" x="216" y="100" width="176" height="160" rx="10"/>
  <circle class="fb" cx="241" cy="126" r="11"/>
  <text class="t1 b" x="241" y="130.5" text-anchor="middle">1</text>
  <text class="t1 b t15" x="260" y="131">Source</text>
  <text class="t1 mono" x="230" y="156">sources/NNN-*.md</text>
  <path class="rule" d="M230,170 H378"/>
  <text class="t2" x="230" y="190">one file per source</text>
  <text class="t2" x="230" y="209">numbers · boundary</text>
  <text class="t2" x="230" y="228">funding · limits</text>

  <!-- Layer 2: Claim -->
  <rect class="fb" x="428" y="100" width="196" height="160" rx="10"/>
  <circle class="fb" cx="453" cy="126" r="11"/>
  <text class="t1 b" x="453" y="130.5" text-anchor="middle">2</text>
  <text class="t1 b t15" x="472" y="131">Claim</text>
  <text class="mu mono" x="610" y="131" text-anchor="end">C001 …</text>
  <text class="t1 mono" x="442" y="156">claims.md</text>
  <path class="rule" d="M442,170 H610"/>
  <text class="t2" x="442" y="190">statement · scope</text>
  <text class="t2" x="442" y="209">period · attribution</text>
  <text class="t2" x="442" y="228">kind · quote · status</text>
  <text class="ht b" x="442" y="247">human check</text>

  <!-- Layer 3: Output -->
  <rect class="fb" x="660" y="100" width="164" height="160" rx="10"/>
  <circle class="fb" cx="685" cy="126" r="11"/>
  <text class="t1 b" x="685" y="130.5" text-anchor="middle">3</text>
  <text class="t1 b t15" x="704" y="131">Output</text>
  <text class="t1 mono" x="674" y="156">outputs/*.md</text>
  <path class="rule" d="M674,170 H810"/>
  <text class="t2" x="674" y="190">prose for a reader</text>
  <text class="t2" x="674" y="209">facts cite <tspan class="mono">[C001]</tspan></text>

  <!-- Each layer is written from the one before it -->
  <path class="ln" d="M180,180 H216" marker-end="url(#el-arrow)"/>
  <path class="ln" d="M392,180 H428" marker-end="url(#el-arrow)"/>
  <path class="ln" d="M624,180 H660" marker-end="url(#el-arrow)"/>

  <!-- check.sh validates the links between layers 1-2 and 2-3 -->
  <path class="aln" d="M404,300 V184"/>
  <path class="aln" d="M636,300 V184"/>
  <circle class="adot" cx="404" cy="180" r="4"/>
  <circle class="adot" cx="636" cy="180" r="4"/>
  <rect class="ab" x="216" y="300" width="608" height="46" rx="8"/>
  <text class="at b mono" x="230" y="319">scripts/check.sh</text>
  <text class="t2" x="230" y="337">every cited claim ID exists · every cited source file exists · required fields present</text>
</svg>
